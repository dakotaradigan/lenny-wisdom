<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenny's Guest Graph</title>
<style>
  :root {
    color-scheme: light;
    --surface:        #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --muted:          #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --guest:          #2a78d6;
    --topic:          #eb6834;
    --framework:      #1baf7a;
    --company:        #898781;
    --edge:           rgba(11,11,11,0.16);
    --edge-strong:    rgba(11,11,11,0.50);
    --halo:           0.15;
    --vignette:       rgba(11,11,11,0.045);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface:        #16161a;
      --page:           #101014;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --muted:          #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --guest:          #3987e5;
      --topic:          #d95926;
      --framework:      #199e70;
      --company:        #8b8b93;
      --edge:           rgba(255,255,255,0.17);
      --edge-strong:    rgba(255,255,255,0.65);
      --halo:           0.5;
      --vignette:       rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:        #16161a;
    --page:           #101014;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --hairline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --guest:          #3987e5;
    --topic:          #d95926;
    --framework:      #199e70;
    --company:        #8b8b93;
    --edge:           rgba(255,255,255,0.17);
    --edge-strong:    rgba(255,255,255,0.65);
    --halo:           0.5;
    --vignette:       rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 18px;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
    z-index: 4;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { font-size: 12.5px; color: var(--text-secondary); }

  #search {
    margin-left: auto;
    font: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    width: 220px;
  }
  #search:focus { outline: 2px solid var(--guest); outline-offset: 1px; }

  #legend { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 12.5px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    transition: opacity 0.25s;
  }
  .chip[aria-pressed="false"] { opacity: 0.38; }
  .chip .swatch { width: 10px; height: 10px; border-radius: 50%; }
  .chip[data-type="topic"] .swatch { width: 12px; height: 12px; }
  .chip[data-type="framework"] .swatch { border-radius: 2px; transform: rotate(45deg); }
  .chip[data-type="company"] .swatch { border-radius: 2px; }

  #theme-toggle {
    font: inherit;
    font-size: 12.5px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
  }

  #stage { position: relative; flex: 1; background: var(--surface); }
  canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }

  #tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 7px 10px;
    font-size: 12.5px;
    max-width: 280px;
    display: none;
    z-index: 3;
  }
  #tooltip .type { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

  #card {
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: 290px;
    max-height: 46%;
    overflow: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.16);
    padding: 12px 14px;
    font-size: 13px;
    display: none;
    z-index: 2;
  }
  #card h2 { font-size: 14.5px; margin: 0 0 2px; }
  #card .type { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  #card .desc { color: var(--text-secondary); font-size: 12.5px; margin: 6px 0 2px; }
  #card h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 4px; }
  #card ul { list-style: none; margin: 0; padding: 0; }
  #card li { padding: 1px 0; }
  #card li button {
    font: inherit; color: var(--text-primary); background: none; border: none;
    padding: 0; cursor: pointer; text-align: left;
  }
  #card li button:hover { text-decoration: underline; }
  #card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  #card #close {
    position: absolute; top: 8px; right: 10px; border: none; background: none;
    color: var(--muted); font-size: 15px; cursor: pointer; padding: 2px;
  }

  #controls {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 2;
  }
  #controls button {
    width: 36px;
    height: 36px;
    font-size: 17px;
    line-height: 1;
    color: var(--text-primary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    cursor: pointer;
  }
  #controls button:active { transform: scale(0.94); }

  #hint {
    position: absolute;
    right: 62px;
    bottom: 20px;
    color: var(--muted);
    font-size: 11.5px;
    z-index: 1;
    text-align: right;
  }
  @media (max-width: 640px) {
    #search { width: 130px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Lenny&rsquo;s Guest Graph</h1>
    <div class="sub" id="subtitle">Every guest, topic, and framework from Lenny&rsquo;s Podcast — connected.</div>
  </div>
  <div id="legend" role="group" aria-label="Toggle node types"></div>
  <input id="search" type="search" placeholder="Search guests, frameworks…" aria-label="Search nodes">
  <button id="theme-toggle" aria-label="Toggle color theme">Theme</button>
</header>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="tooltip" role="status"></div>
  <aside id="card" aria-live="polite"></aside>
  <div id="controls">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-fit" aria-label="Fit graph to view">⤢</button>
  </div>
  <div id="hint">drag to pan · pinch or scroll to zoom · tap a node</div>
</div>
<script src="graph-data.js"></script>
<script>
(() => {
  const data = window.GRAPH;
  if (!data) { document.getElementById('subtitle').textContent = 'graph-data.js missing — run scripts/build_graph.py'; return; }

  const TYPES = ['guest', 'topic', 'framework', 'company'];
  const TYPE_LABEL = { guest: 'Guest', topic: 'Topic', framework: 'Framework', company: 'Company' };
  const TYPE_PLURAL = { guest: 'Guests', topic: 'Topics', framework: 'Frameworks', company: 'Companies' };
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- model ----------
  const nodes = data.nodes.map(n => ({
    ...n, x: 0, y: 0, vx: 0, vy: 0, deg: 0,
    dim: 0,      // eased 0..1 — how faded this node currently is
    px: 0, py: 0,
  }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = data.edges.map(e => ({ s: byId.get(e.source), t: byId.get(e.target), kind: e.kind }));
  const neighbors = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) {
    e.s.deg++; e.t.deg++;
    neighbors.get(e.s.id).push(e.t);
    neighbors.get(e.t.id).push(e.s);
  }
  const counts = data.meta.counts;
  document.getElementById('subtitle').textContent =
    `${counts.guests} guests · ${counts.topics} topics · ${counts.frameworks} frameworks · ${counts.companies} shared companies · ${counts.edges} connections`;

  const radius = n =>
    n.type === 'topic' ? 15 :
    n.type === 'framework' ? 6.5 :
    n.type === 'company' ? 4 + Math.min(3, n.deg * 0.35) :
    4 + Math.min(6, n.deg * 0.8);

  function hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h | 0;
  }

  // Per-node drift signature for the idle "breathing" motion.
  for (const n of nodes) {
    n.ph = (Math.abs(hash(n.id + 'p')) % 6283) / 1000;
    n.sp = 0.5 + (Math.abs(hash(n.id + 's')) % 1000) / 1400;
  }

  // Seed positions: topics on an inner ring, isolated guests on the periphery.
  const isolated = nodes.filter(n => n.deg === 0);
  {
    let ti = 0, topicsN = nodes.filter(n => n.type === 'topic').length;
    let ii = 0;
    for (const n of nodes) {
      if (n.type === 'topic') {
        const a = (ti++ / topicsN) * 2 * Math.PI;
        n.x = Math.cos(a) * 260; n.y = Math.sin(a) * 260;
      } else if (n.deg === 0) {
        const a = (ii++ / isolated.length) * 2 * Math.PI;
        n.x = Math.cos(a) * 640; n.y = Math.sin(a) * 640;
      } else {
        const a = Math.atan2(hash(n.id + 'y'), hash(n.id + 'x'));
        const r = 60 + Math.abs(hash(n.id)) % 340;
        n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
      }
    }
  }

  // ---------- simulation ----------
  const SPRING_LEN = { 'topic-guest': 120, 'topic-framework': 95, 'framework-guest': 70, 'guest-company': 60 };
  let alpha = 1;
  let hover = null, selected = null, dragNode = null;
  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = (hash(a.id) % 7) - 3 || 1; dy = (hash(b.id) % 7) - 3 || 1; d2 = dx * dx + dy * dy; }
        // Topics repel each other hard so each anchors its own cluster
        // (their labels are always on and must not collide).
        const topicPair = a.type === 'topic' && b.type === 'topic';
        if (d2 > (topicPair ? 4000000 : 160000)) continue;
        const f = (topicPair ? 60000 : 900) / d2 * alpha;
        const d = Math.sqrt(d2);
        const fx = dx / d * f, fy = dy / d * f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
    for (const e of edges) {
      const len = SPRING_LEN[e.kind] || 90;
      let dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const f = (d - len) * 0.02 * alpha;
      const fx = dx / d * f, fy = dy / d * f;
      e.s.vx += fx; e.s.vy += fy;
      e.t.vx -= fx; e.t.vy -= fy;
    }
    for (const n of nodes) {
      if (n.deg === 0) {
        const d = Math.sqrt(n.x * n.x + n.y * n.y) || 1;
        const f = (d - 700) * -0.02 * alpha;
        n.vx += n.x / d * f; n.vy += n.y / d * f;
      } else {
        n.vx -= n.x * 0.0012 * alpha;
        n.vy -= n.y * 0.0012 * alpha;
      }
      if (n !== dragNode) {
        n.vx *= 0.6; n.vy *= 0.6;
        n.x += n.vx; n.y += n.vy;
      }
    }
    alpha = Math.max(0, alpha * 0.995 - 0.0004);
  }
  for (let i = 0; i < 320; i++) tick();
  alpha = 0.05;

  // ---------- view state ----------
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  let W = 0, H = 0, DPR = 1;
  // Camera eases toward its target for the glide feel.
  let scale = 1, tx = 0, ty = 0;
  let scaleT = 1, txT = 0, tyT = 0;
  let focusAmt = 0;              // eased 0..1 — strength of the focus dimming
  const visible = { guest: true, topic: true, framework: true, company: true };
  let searchQ = '';

  let didInit = false;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    if (!didInit) {
      didInit = true;
      // Open framed on the connected core — connections readable at once;
      // the isolated periphery is one "fit" tap away.
      fit(true);
      scale = scaleT; tx = txT; ty = tyT;
    }
    makeVignette();
  }
  function fit(coreOnly) {
    let shown = nodes.filter(n => visible[n.type] && (!coreOnly || n.deg > 0));
    if (!shown.length) shown = nodes.filter(n => visible[n.type]);
    if (!shown.length) return;
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const n of shown) {
      minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
      minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
    }
    const pad = 60;
    scaleT = Math.min((W - pad) / (maxX - minX || 1), (H - pad) / (maxY - minY || 1));
    scaleT = Math.max(0.05, Math.min(scaleT, 2));
    txT = W / 2 - (minX + maxX) / 2 * scaleT;
    tyT = H / 2 - (minY + maxY) / 2 * scaleT;
  }

  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  let C = {}, sprites = {}, vignette = null;
  function readColors() {
    C = {
      surface: css('--surface'), edge: css('--edge'), edgeStrong: css('--edge-strong'),
      primary: css('--text-primary'), secondary: css('--text-secondary'), muted: css('--muted'),
      guest: css('--guest'), topic: css('--topic'), framework: css('--framework'), company: css('--company'),
      halo: parseFloat(css('--halo')) || 0.25, vignette: css('--vignette'),
    };
    makeSprites();
    makeVignette();
  }

  // Soft radial glow sprites, one per node type — drawn behind the crisp core.
  const SPRITE_R = 48;
  function makeSprites() {
    sprites = {};
    for (const t of TYPES) {
      const c = document.createElement('canvas');
      c.width = c.height = SPRITE_R * 2;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(SPRITE_R, SPRITE_R, 2, SPRITE_R, SPRITE_R, SPRITE_R);
      grad.addColorStop(0, C[t]);
      grad.addColorStop(0.25, C[t]);
      grad.addColorStop(1, 'transparent');
      g.globalAlpha = C.halo;
      g.fillStyle = grad;
      g.fillRect(0, 0, SPRITE_R * 2, SPRITE_R * 2);
      sprites[t] = c;
    }
  }
  function makeVignette() {
    if (!W || !H) return;
    vignette = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, C.vignette);
  }
  readColors();

  function nodeVisible(n) { return visible[n.type]; }
  function matches(n) { return searchQ && n.name.toLowerCase().includes(searchQ); }

  // ---------- drawing ----------
  function drawShape(n, r) {
    ctx.beginPath();
    if (n.type === 'framework') {
      ctx.moveTo(n.px, n.py - r * 1.25); ctx.lineTo(n.px + r * 1.25, n.py);
      ctx.lineTo(n.px, n.py + r * 1.25); ctx.lineTo(n.px - r * 1.25, n.py);
      ctx.closePath();
    } else if (n.type === 'company') {
      const s = r * 1.15;
      ctx.rect(n.px - s, n.py - s, s * 2, s * 2);
    } else {
      ctx.arc(n.px, n.py, r, 0, 2 * Math.PI);
    }
  }

  const lerp = (a, b, k) => a + (b - a) * k;

  function draw(t) {
    // Ease the camera toward its target.
    const ck = REDUCED ? 1 : 0.16;
    scale = lerp(scale, scaleT, ck);
    tx = lerp(tx, txT, ck);
    ty = lerp(ty, tyT, ck);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = C.surface;
    ctx.fillRect(0, 0, W, H);

    // Idle breathing: a small world-space drift on top of the settled layout.
    const drift = REDUCED ? 0 : 2.2;
    for (const n of nodes) {
      const ox = drift * Math.sin(t * 0.00045 * n.sp + n.ph);
      const oy = drift * Math.cos(t * 0.00038 * n.sp + n.ph * 1.7);
      n.px = (n.x + ox) * scale + tx;
      n.py = (n.y + oy) * scale + ty;
    }

    const focus = selected || hover;
    const inFocus = new Set();
    if (focus) {
      inFocus.add(focus.id);
      for (const m of neighbors.get(focus.id)) inFocus.add(m.id);
    }
    focusAmt = lerp(focusAmt, focus ? 1 : 0, REDUCED ? 1 : 0.14);

    // Each node eases toward its dim target — focus and search compose.
    for (const n of nodes) {
      let target = 0;
      if (focus && !inFocus.has(n.id)) target = Math.max(target, focusAmt);
      if (searchQ && !matches(n) && !(focus && inFocus.has(n.id))) target = Math.max(target, 1);
      n.dim = REDUCED ? target : lerp(n.dim, target, 0.18);
    }

    // Edges — width and presence grow with zoom so connections stay readable.
    const ew = Math.max(0.7, Math.min(1.8, 0.5 + scale * 0.55));
    const ea = Math.max(0.65, Math.min(1, 0.45 + scale * 0.55));
    for (const e of edges) {
      if (!nodeVisible(e.s) || !nodeVisible(e.t)) continue;
      const lit = focus && inFocus.has(e.s.id) && inFocus.has(e.t.id) &&
                  (e.s === focus || e.t === focus);
      const dim = Math.max(e.s.dim, e.t.dim);
      ctx.globalAlpha = (lit ? 1 : ea) * (1 - 0.85 * dim);
      ctx.strokeStyle = lit ? C.edgeStrong : C.edge;
      ctx.lineWidth = lit ? ew + 1.1 * focusAmt : ew;
      ctx.beginPath();
      ctx.moveTo(e.s.px, e.s.py);
      ctx.lineTo(e.t.px, e.t.py);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Glow pass, then crisp cores.
    const rs = Math.max(0.65, Math.min(1.25, scale));
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const r = radius(n) * rs;
      const a = 1 - 0.88 * n.dim;
      if (a < 0.03) continue;
      const boost = (n === focus || matches(n)) ? 1.45 : 1;
      const gr = r * 4.2 * boost;
      ctx.globalAlpha = a;
      ctx.drawImage(sprites[n.type], n.px - gr, n.py - gr, gr * 2, gr * 2);
    }
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const r = radius(n) * rs;
      const a = 1 - 0.88 * n.dim;
      if (a < 0.03) continue;
      ctx.globalAlpha = a;
      ctx.fillStyle = C[n.type];
      drawShape(n, r);
      ctx.fill();
      if (n === selected) {
        // A slow pulse on the selected node keeps it findable.
        const pulse = REDUCED ? 0 : Math.sin(t * 0.004) * 1.2;
        ctx.strokeStyle = C.primary;
        ctx.lineWidth = 1.5;
        drawShape(n, r + 2.5 + pulse);
        ctx.stroke();
      } else if (n === hover || matches(n)) {
        ctx.strokeStyle = C.primary;
        ctx.lineWidth = 1.5;
        drawShape(n, r + 1.5);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // Labels — fade in with zoom (the Obsidian move), always on for topics.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const zoomA = Math.max(0, Math.min(1, (scale - 0.85) * 2.2));
    const zoomAll = Math.max(0, Math.min(1, (scale - 1.45) * 2.2));
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const nd = 1 - 0.95 * n.dim;
      let la = 0;
      if (n.type === 'topic') la = 1;
      else if (n === hover || n === selected || matches(n)) la = 1;
      else if (focus && inFocus.has(n.id)) la = focusAmt;
      else la = n.type === 'company' ? zoomAll : zoomA;
      la *= nd;
      if (la < 0.04) continue;
      const r = radius(n) * rs;
      const big = n.type === 'topic';
      ctx.font = (big ? '600 12.5px ' : '11px ') + 'system-ui, -apple-system, "Segoe UI", sans-serif';
      const y = n.py + r * (n.type === 'framework' ? 1.4 : 1.15) + 3;
      ctx.globalAlpha = la;
      ctx.lineWidth = 3;
      ctx.strokeStyle = C.surface;
      ctx.strokeText(n.name, n.px, y);
      ctx.fillStyle = big ? C.primary : C.secondary;
      ctx.fillText(n.name, n.px, y);
    }
    ctx.globalAlpha = 1;

    // Depth vignette.
    if (vignette) {
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- animation ----------
  let raf = null, running = false;
  function loop(t) {
    if (alpha > 0.005) tick();
    draw(t || 0);
    if (running) raf = requestAnimationFrame(loop);
  }
  function start() {
    if (!running) { running = true; raf = requestAnimationFrame(loop); }
  }
  function stop() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else if (!REDUCED) start();
  });
  function kick(a) {
    alpha = Math.max(alpha, a);
    if (REDUCED && !raf) raf = requestAnimationFrame(t => { raf = null; loop(t); });
  }
  // Reduced motion: render on demand only. Otherwise: always alive.
  if (REDUCED) {
    const once = () => { if (!raf) raf = requestAnimationFrame(t => { raf = null; if (alpha > 0.005) { tick(); once(); } draw(t); }); };
    kick(0.05); once();
  }

  // ---------- interaction ----------
  function pick(mx, my) {
    let best = null, bestD = 1e9;
    for (const n of nodes) {
      if (!nodeVisible(n)) continue;
      const r = Math.max(7, radius(n) * Math.max(0.65, Math.min(1.25, scale)) + 3);
      const dx = mx - n.px, dy = my - n.py;
      const d2 = dx * dx + dy * dy;
      if (d2 < r * r && d2 < bestD) { best = n; bestD = d2; }
    }
    return best;
  }

  const tooltip = document.getElementById('tooltip');
  function showTooltip(n, cx, cy) {
    tooltip.innerHTML = `<div class="type">${TYPE_LABEL[n.type]}${n.category ? ' · ' + n.category : ''}</div>` +
      `<strong>${esc(n.name)}</strong>` +
      (n.deg ? `<div style="color:var(--text-secondary)">${n.deg} connection${n.deg > 1 ? 's' : ''}</div>` : '');
    tooltip.style.display = 'block';
    const rect = stage.getBoundingClientRect();
    tooltip.style.left = Math.min(cx + 14, rect.width - 300) + 'px';
    tooltip.style.top = (cy + 14) + 'px';
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Zoom about a screen point, applied to the camera target (the loop glides there).
  function zoomAt(cx, cy, factor, instant) {
    const ns = Math.max(0.05, Math.min(4, scaleT * factor));
    txT = cx - (cx - txT) * (ns / scaleT);
    tyT = cy - (cy - tyT) * (ns / scaleT);
    scaleT = ns;
    if (instant) { scale = scaleT; tx = txT; ty = tyT; }
    if (REDUCED) kick(0.0);
  }

  // Multi-pointer state: one pointer pans or drags a node, two pointers pinch.
  const pointers = new Map();
  let panning = false, moved = false, lastX = 0, lastY = 0;
  let pinchD = 0, lastTap = { t: 0, x: 0, y: 0 };

  function pinchInfo() {
    const [a, b] = [...pointers.values()];
    return {
      d: Math.hypot(a.x - b.x, a.y - b.y),
      cx: (a.x + b.x) / 2,
      cy: (a.y + b.y) / 2,
    };
  }

  canvas.addEventListener('pointerdown', ev => {
    canvas.setPointerCapture(ev.pointerId);
    pointers.set(ev.pointerId, { x: ev.offsetX, y: ev.offsetY });
    if (pointers.size === 2) {
      // Entering pinch: cancel any pan/drag in progress.
      panning = false; dragNode = null; moved = true;
      pinchD = pinchInfo().d;
      canvas.classList.add('dragging');
      return;
    }
    if (pointers.size > 2) return;
    const n = pick(ev.offsetX, ev.offsetY);
    moved = false;
    lastX = ev.offsetX; lastY = ev.offsetY;
    if (n) { dragNode = n; }
    else { panning = true; canvas.classList.add('dragging'); }
  });
  canvas.addEventListener('pointermove', ev => {
    const p = pointers.get(ev.pointerId);
    if (p) { p.x = ev.offsetX; p.y = ev.offsetY; }
    if (pointers.size === 2) {
      const { d, cx, cy } = pinchInfo();
      if (pinchD > 0 && d > 0) zoomAt(cx, cy, d / pinchD, true);
      pinchD = d;
      return;
    }
    const dx = ev.offsetX - lastX, dy = ev.offsetY - lastY;
    if (panning || dragNode) {
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    }
    if (panning) {
      txT += dx; tyT += dy; tx += dx; ty += dy;
      lastX = ev.offsetX; lastY = ev.offsetY;
      kick(0.0);
    } else if (dragNode) {
      dragNode.x = (ev.offsetX - tx) / scale;
      dragNode.y = (ev.offsetY - ty) / scale;
      dragNode.vx = dragNode.vy = 0;
      lastX = ev.offsetX; lastY = ev.offsetY;
      kick(0.12);
    } else if (ev.pointerType === 'mouse') {
      const n = pick(ev.offsetX, ev.offsetY);
      hover = n;
      if (n) showTooltip(n, ev.offsetX, ev.offsetY);
      else tooltip.style.display = 'none';
      canvas.style.cursor = n ? 'pointer' : 'grab';
      if (REDUCED) kick(0.0);
    }
  });
  function endPointer(ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinchD = 0;
    if (pointers.size > 0) return;
    canvas.classList.remove('dragging');
    if (!moved) {
      const n = pick(ev.offsetX, ev.offsetY);
      if (!n && ev.pointerType !== 'mouse') {
        // Double-tap on empty space zooms in; a second quick tap zooms.
        const now = performance.now();
        if (now - lastTap.t < 320 && Math.hypot(ev.offsetX - lastTap.x, ev.offsetY - lastTap.y) < 40) {
          zoomAt(ev.offsetX, ev.offsetY, 1.8);
          lastTap.t = 0;
        } else {
          lastTap = { t: now, x: ev.offsetX, y: ev.offsetY };
          select(null);
        }
      } else {
        select(n);
      }
    }
    panning = false; dragNode = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', ev => {
    if (ev.pointerType === 'mouse') { hover = null; tooltip.style.display = 'none'; if (REDUCED) kick(0.0); }
  });
  canvas.addEventListener('wheel', ev => {
    ev.preventDefault();
    zoomAt(ev.offsetX, ev.offsetY, Math.exp(-ev.deltaY * 0.0015));
  }, { passive: false });
  canvas.addEventListener('dblclick', ev => zoomAt(ev.offsetX, ev.offsetY, 1.8));

  // On-screen controls — the zoom path that works everywhere.
  document.getElementById('zoom-in').onclick = () => zoomAt(W / 2, H / 2, 1.45);
  document.getElementById('zoom-out').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.45);
  document.getElementById('zoom-fit').onclick = () => { fit(false); if (REDUCED) kick(0.0); };

  // ---------- selection card ----------
  const card = document.getElementById('card');
  function select(n) {
    selected = n;
    if (!n) { card.style.display = 'none'; return; }
    const groups = {};
    for (const m of neighbors.get(n.id)) (groups[m.type] = groups[m.type] || []).push(m);
    let html = `<button id="close" aria-label="Close">✕</button>` +
      `<div class="type">${TYPE_LABEL[n.type]}${n.category ? ' · ' + n.category : ''}</div>` +
      `<h2>${esc(n.name)}</h2>`;
    if (n.description) html += `<div class="desc">${esc(n.description)}</div>`;
    if (n.file) html += `<div class="desc">${esc(n.file)}</div>`;
    for (const t of TYPES) {
      if (!groups[t]) continue;
      groups[t].sort((a, b) => a.name.localeCompare(b.name));
      html += `<h3>${TYPE_PLURAL[t]} (${groups[t].length})</h3><ul>` +
        groups[t].map(m =>
          `<li><button data-id="${esc(m.id)}"><span class="dot" style="background:var(--${m.type})"></span>${esc(m.name)}</button></li>`
        ).join('') + '</ul>';
    }
    card.innerHTML = html;
    card.style.display = 'block';
    card.querySelector('#close').onclick = () => select(null);
    for (const b of card.querySelectorAll('li button')) {
      b.onclick = () => {
        const m = byId.get(b.dataset.id);
        if (m) { centerOn(m); select(m); }
      };
    }
    if (REDUCED) kick(0.0);
  }
  function centerOn(n) {
    txT = W / 2 - n.x * scaleT;
    tyT = H / 2 - n.y * scaleT;
  }

  // ---------- legend ----------
  const legend = document.getElementById('legend');
  for (const t of TYPES) {
    const count = counts[TYPE_PLURAL[t].toLowerCase()];
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.type = t;
    chip.setAttribute('aria-pressed', 'true');
    chip.innerHTML = `<span class="swatch" style="background:var(--${t})"></span>${TYPE_PLURAL[t]} · ${count}`;
    chip.onclick = () => {
      visible[t] = !visible[t];
      chip.setAttribute('aria-pressed', String(visible[t]));
      if (selected && !visible[selected.type]) select(null);
      if (REDUCED) kick(0.0);
    };
    legend.appendChild(chip);
  }

  // ---------- search ----------
  const search = document.getElementById('search');
  search.addEventListener('input', () => { searchQ = search.value.trim().toLowerCase(); if (REDUCED) kick(0.0); });
  search.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && searchQ) {
      const hits = nodes.filter(m => nodeVisible(m) && matches(m))
        .sort((a, b) => b.deg - a.deg);
      if (hits[0]) { centerOn(hits[0]); select(hits[0]); }
    }
    if (ev.key === 'Escape') { search.value = ''; searchQ = ''; if (REDUCED) kick(0.0); }
  });

  // ---------- theme ----------
  document.getElementById('theme-toggle').onclick = () => {
    const root = document.documentElement;
    const dark = getComputedStyle(root).colorScheme.includes('dark');
    root.dataset.theme = dark ? 'light' : 'dark';
    readColors();
    if (REDUCED) kick(0.0);
  };
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); if (REDUCED) kick(0.0); });
  new MutationObserver(() => { readColors(); if (REDUCED) kick(0.0); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  window.addEventListener('resize', () => { resize(); if (REDUCED) kick(0.0); });
  resize();
  if (!REDUCED) start(); else kick(0.05);
})();
</script>
</body>
</html>
